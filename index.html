<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --orange: #FF3C20;
    --orange-dim: rgba(255, 60, 32, 0.18);
    --orange-mid: rgba(255, 60, 32, 0.55);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; } }
  :root[data-theme="dark"] { --bg: #000000; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--orange);
    font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 1.5rem;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
  }

  .logo {
    display: block;
    width: min(44vw, 11rem);
    height: auto;
    margin-bottom: 0.5rem;
  }
  .dial {
    position: relative;
    width: min(78vw, 22rem);
    aspect-ratio: 1;
  }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { stroke: var(--orange-dim); }
  .arc { stroke: var(--orange); stroke-linecap: round; transition: stroke-dashoffset 0.08s linear; }
  .readout {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .num { font-size: min(40vw, 11rem); text-shadow: 0 0 24px rgba(255, 60, 32, 0.45); }
  .result { font-size: min(22vw, 6rem); text-shadow: 0 0 28px rgba(255, 60, 32, 0.6); }
  .tick { animation: tick 0.35s ease-out; }
  .reveal { animation: reveal 0.6s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes tick { from { transform: scale(1.12); opacity: 0.5; } to { transform: scale(1); opacity: 1; } }
  @keyframes reveal { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .controls { display: flex; gap: 1.25rem; align-items: center; }
  button {
    font: inherit;
    color: var(--orange);
    background: transparent;
    border: 3px solid var(--orange);
    border-radius: 999px;
    cursor: pointer;
    display: grid;
    place-items: center;
    touch-action: manipulation;
  }
  button:active { background: var(--orange-dim); }
  button:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
  .play { width: 4.25rem; height: 4.25rem; background: var(--orange); color: #000; border: none; }
  .play:active { background: var(--orange-mid); }
  .reset { width: 3rem; height: 3rem; border-width: 2px; }
  .play svg { width: 1.8rem; height: 1.8rem; }
  .reset svg { width: 1.2rem; height: 1.2rem; }

  .edit {
    border: none;
    border-radius: 0.5rem;
    font-size: 1.15rem;
    font-weight: 500;
    padding: 0.5rem 0.75rem;
    opacity: 0.7;
  }
  .editor { display: none; gap: 0.6rem; align-items: center; }
  .editor.open { display: flex; }
  .editor input {
    font: inherit;
    font-size: 1.4rem;
    font-weight: 700;
    width: 7rem;
    text-align: center;
    color: var(--orange);
    background: #000;
    border: 2px solid var(--orange);
    border-radius: 0.5rem;
    padding: 0.4rem;
  }
  .editor button { border-radius: 0.5rem; padding: 0.45rem 1rem; font-size: 1.2rem; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .tick, .reveal { animation: none; }
    .arc { transition: none; }
  }
</style>
</head>

  <div class="dial" aria-live="polite">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="90" fill="none" stroke-width="8"/>
      <circle class="arc" id="arc" cx="100" cy="100" r="90" fill="none" stroke-width="8"/>
    </svg>
    <div class="readout"><span id="display" class="num">10</span></div>
  </div>

  <div class="controls">
    <button class="reset" id="reset" aria-label="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="play" id="play" aria-label="Play">
      <svg id="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div style="width:3rem"></div>
  </div>

  <div class="editor" id="editor">
    <input id="pctInput" type="text" inputmode="decimal" aria-label="Result percentage">
    <button id="saveBtn">Save</button>
  </div>

<script>
  const DURATION = 10;               // seconds
  const DEFAULT_RESULT = "0.91%";    // shown after 0

  const display = document.getElementById("display");
  const arc = document.getElementById("arc");
  const playBtn = document.getElementById("play");
  const icon = document.getElementById("icon");
  const resetBtn = document.getElementById("reset");
  const dial = document.querySelector(".dial");
  const editor = document.getElementById("editor");
  const pctInput = document.getElementById("pctInput");
  const saveBtn = document.getElementById("saveBtn");

  const C = 2 * Math.PI * 90;
  arc.style.strokeDasharray = C;
  arc.style.strokeDashoffset = 0;

  const PLAY = '<path d="M8 5v14l11-7z"/>';
  const PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  let result = DEFAULT_RESULT;
  try { const saved = localStorage.getItem("countdownResult"); if (saved) result = saved; } catch (e) {}

  let remainingMs = DURATION * 1000;
  let running = false;
  let finished = false;
  let lastT = 0;
  let raf = null;
  let shownSec = DURATION;

  function setNumber(n) {
    display.className = "num";
    display.textContent = n;
    void display.offsetWidth;
    display.classList.add("tick");
  }

  function setIcon(isPlaying) {
    icon.innerHTML = isPlaying ? PAUSE : PLAY;
    playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
  }

  function frame(t) {
    remainingMs -= t - lastT;
    lastT = t;
    if (remainingMs <= 0) { finish(); return; }
    arc.style.strokeDashoffset = C * (1 - remainingMs / (DURATION * 1000));
    const sec = Math.ceil(remainingMs / 1000);
    if (sec !== shownSec) { shownSec = sec; setNumber(sec); }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (finished) reset();
    running = true;
    setIcon(true);
    lastT = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    setIcon(false);
  }

  function finish() {
    running = false;
    finished = true;
    cancelAnimationFrame(raf);
    remainingMs = 0;
    arc.style.strokeDashoffset = C;
    setNumber(0);
    setIcon(false);
    if (navigator.vibrate) navigator.vibrate(200);
    setTimeout(() => {
      if (!finished) return;
      display.className = "result";
      display.textContent = result;
      void display.offsetWidth;
      display.classList.add("reveal");
    }, 700);
  }

  function reset() {
    pause();
    finished = false;
    remainingMs = DURATION * 1000;
    shownSec = DURATION;
    arc.style.strokeDashoffset = 0;
    display.className = "num";
    display.textContent = DURATION;
  }

  playBtn.addEventListener("click", () => running ? pause() : start());
  resetBtn.addEventListener("click", reset);

  // Hidden setting: press and hold the ring for 3 seconds (while stopped) to change the result
  let holdTimer = null;
  function openEditor() {
    if (running) return;
    pctInput.value = result.replace("%", "");
    editor.classList.add("open");
    pctInput.focus();
  }
  function startHold(e) { if (running) return; holdTimer = setTimeout(openEditor, 3000); }
  function cancelHold() { clearTimeout(holdTimer); }
  dial.addEventListener("touchstart", startHold, { passive: true });
  dial.addEventListener("mousedown", startHold);
  ["touchend", "touchcancel", "touchmove", "mouseup", "mouseleave"].forEach(ev => dial.addEventListener(ev, cancelHold));
  dial.addEventListener("contextmenu", e => e.preventDefault());

  function saveResult() {
    let v = pctInput.value.trim();
    if (v === "") v = DEFAULT_RESULT;
    if (!v.endsWith("%")) v += "%";
    result = v;
    try { localStorage.setItem("countdownResult", result); } catch (e) {}
    editor.classList.remove("open");
    if (finished) display.textContent = result;
  }
  saveBtn.addEventListener("click", saveResult);
  pctInput.addEventListener("keydown", e => { if (e.key === "Enter") saveResult(); });
</script>
</body>
</html>
